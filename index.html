<!doctype html>

</head>
<body>
  <div id="storage-warning" class="warning" role="alert" hidden></div>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#today" aria-label="春秋蝉首页"><img src="./icon.svg" width="36" height="36" alt=""><span>春秋蝉<small>把日子，慢慢过好。</small></span></a>
      <nav aria-label="主导航">
        <a href="#today" data-page="today"><span>◉</span>今日<span class="nav-en">TODAY</span></a>
        <a href="#growth" data-page="growth"><span>⌘</span>生长<span class="nav-en">GROWTH</span></a>
